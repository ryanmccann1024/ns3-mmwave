[scenario]
name = channel-scored-placement-example
seed = 801
run_id = 1
duration_s = 10.0
warmup_s = 2.0
tick_s = 0.1
nodes_file = nodes.json

[channel]
band = mmwave
channel_model = nyu
condition_model = static_los
scenario = UMi
frequency_ghz = 28.0

[rl]
enabled = true
controlled_nodes = air-a, air-b
max_controlled_nodes = 2
action_profile = move_2d
decision_interval_s = 0.5
step_size_m = 1.0
reward_type = all_links_los
x_min = 0.0
x_max = 400.0
y_min = 0.0
y_max = 400.0
z_min = 0.0
z_max = 100.0

[baseline]
algorithm = geometric
objective = balanced
movable_nodes = air-a, air-b
planning_seed = 701
seed = 201
max_iterations = 100
candidate_grid_cells = 100
coverage_grid_cells = 100
grid_min_resolution_m = 10.0
aerial_fixed_cost_m2 = 0
ground_fixed_cost_m2 = 0
aerial_cost_m2_per_m = 0
ground_cost_m2_per_m = 0
aerial_max_displacement_m = 100
ground_max_displacement_m = 100
