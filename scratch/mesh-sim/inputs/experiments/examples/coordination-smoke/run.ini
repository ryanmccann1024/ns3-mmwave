# Public coordination smoke: one sub-6 rural coverage case with three peers.
# 64 s at 0.1 s ticks and 1 s decisions gives 64 decisions per episode.
# Plumbing fixture only; not a mission-performance experiment.
[scenario]
name = coordination-smoke-rural-coverage-3-peers
seed = 101
run_id = 1
duration_s = 64.0
warmup_s = 0.0
tick_s = 0.1
nodes_file = nodes.json
buildings_file = buildings.json
jammers_file =

[channel]
band = sub-6
frequency_ghz = 5.8
tx_power_dbm = 14.0
scenario = RMa
channel_model = 3gpp
condition_model = static_los
blockage_enabled = true
bandwidth_mhz = 5.0
noise_figure_db = 20.0
amc_model = silvus
beamforming_model = table
tx_array_gain_dbi = 3.0
rx_array_gain_dbi = 3.0

[traffic]
model = constant
demand_mbps = 3
flow_topology = explicit_pairs
pairs = [{"src":"ground-1","dst":"drone-1","demand_mbps":1.5},{"src":"ground-1","dst":"vehicle-1","demand_mbps":1.5},{"src":"drone-1","dst":"ground-1","demand_mbps":1.5},{"src":"drone-1","dst":"vehicle-1","demand_mbps":1.5},{"src":"vehicle-1","dst":"ground-1","demand_mbps":1.5},{"src":"vehicle-1","dst":"drone-1","demand_mbps":1.5}]

[routing]
algorithm = shortest_path
max_hops = 5

[rl]
enabled = true
controlled_nodes = all
max_controlled_nodes = 3
action_profile = move_2d
decision_interval_s = 1.0
reward_type = throughput
step_size_m = 1.0
x_min = 0.0
x_max = 200.0
y_min = 0.0
y_max = 200.0
z_min = 0.0
z_max = 60.0
unsafe_separation_m = 5
avoid_buildings = true
building_clearance_m = 2
mask_building_moves = true
avoid_node_collisions = true
coverage_enabled = true
observation_preset = raw_links_v1
reward_components = delivery_ratio
reward_weights = 1
telemetry = steps
manifest_every_decisions = 64
compact_training = false
control_start_s = 0.0

[baseline]
algorithm = none
candidate_grid_cells = 100
coverage_grid_cells = 100
grid_min_resolution_m = 5
coverage_probe_height_m = 1.5
coverage_probe_rx_gain_dbi = 3
coverage_sinr_db = 10

[output]
viz_tick_ms = 1000

[mission]
kind = coverage
goal_x = 100
goal_y = 100
coverage_radius_m = 50
dwell_s = 30
goal_coverage_target = 0.8
